name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bensebih_test
          POSTGRES_USER: bensebih_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bensebih_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: bensebih_test
      DB_USERNAME: bensebih_test
      DB_PASSWORD: ci-only-password
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, pcntl, bcmath, intl, mbstring
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: composer install --working-dir=apps/api --no-interaction --prefer-dist
      - name: Prepare isolated test database
        working-directory: apps/api
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d "$DB_DATABASE" -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
          php artisan migrate --env=testing --force
      # Browsershot is deliberately pinned; validate schema and lock consistency.
      - run: composer validate --working-dir=apps/api --strict --no-check-all
      - run: php apps/api/artisan test
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
